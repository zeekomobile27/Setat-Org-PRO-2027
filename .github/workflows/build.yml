name: Build Setat Org PRO 2027

# البناء يدوي عبر تبويب Actions
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Release APK and AAB
        # تم دمج أمر بناء APK (assembleRelease) و AAB (bundleRelease) في سطر واحد لتوفير الوقت
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Decode Keystore and Sign Apps (APK & AAB)
        run: |
          echo "1. فك تشفير مفتاح التوقيع (Keystore)..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          
          echo "2. البحث عن مسارات ملفات APK و AAB..."
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          
          echo "3. توقيع ملف APK باستخدام apksigner..."
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -n 1)
          $APKSIGNER sign --ks keystore.jks --ks-key-alias "${{ secrets.KEY_ALIAS }}" --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" --key-pass pass:"${{ secrets.KEY_PASSWORD }}" "$APK_PATH"
          
          echo "4. توقيع ملف AAB لجوجل بلاي باستخدام jarsigner..."
          jarsigner -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" "$AAB_PATH" "${{ secrets.KEY_ALIAS }}"

      - name: Upload Release APK (للتجربة على الهاتف)
        uses: actions/upload-artifact@v4
        with:
          name: Setat-Org-PRO-2027-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB (للرفع على جوجل بلاي)
        uses: actions/upload-artifact@v4
        with:
          name: Setat-Org-PRO-2027-AAB
          path: app/build/outputs/bundle/release/*.aab
