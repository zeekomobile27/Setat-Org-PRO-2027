name: Build Setat Org PRO 2027

# البناء يدوياً فقط عبر تبويب Actions
on:
  workflow_dispatch:

# إسكات تحذير Node.js 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      # بناء APK و AAB
      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      # التوقيع التلقائي للملفين
      - name: Decode Keystore and Sign APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -e

          echo "1. فك تشفير شهادة التوقيع..."
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

          echo "2. البحث عن ملف APK..."
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "خطأ: لم يتم العثور على APK."
            exit 1
          fi

          echo "3. البحث عن ملف AAB..."
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" -print -quit)

          if [ -z "$AAB_PATH" ]; then
            echo "خطأ: لم يتم العثور على AAB."
            exit 1
          fi

          echo "4. البحث عن أداة apksigner..."
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "خطأ: لم يتم العثور على apksigner."
            exit 1
          fi

          echo "5. توقيع APK..."
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            "$APK_PATH"

          echo "6. التحقق من توقيع APK..."
          "$APKSIGNER" verify --verbose "$APK_PATH"

          echo "7. توقيع AAB..."
          jarsigner \
            -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            "$AAB_PATH" \
            "$KEY_ALIAS"

          echo "8. التحقق من توقيع AAB..."
          jarsigner -verify -verbose -certs "$AAB_PATH"

          echo "نجح توقيع APK و AAB والتحقق منهما."

      # Read the actual optimization metadata from the signed App Bundle.
      # This reports the three Play metrics without running the memory-heavy HTML analyzer.
      - name: Report R8 metrics from AAB
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" -print -quit)
          python3 - "$AAB_PATH" "$GITHUB_STEP_SUMMARY" <<'PYTHON'
          import json, sys, zipfile
          from pathlib import Path

          aab_path, summary_path = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(aab_path) as bundle:
              report = json.loads(bundle.read("BUNDLE-METADATA/com.android.tools/r8.json"))
          stats = report["stats"]
          metrics = {
              "DEX shrinking": 100.0 - stats["noShrinkingPercentage"],
              "DEX obfuscation": 100.0 - stats["noObfuscationPercentage"],
              "DEX optimization": 100.0 - stats["noOptimizationPercentage"],
          }
          lines = ["### R8 metrics from signed AAB", ""]
          for name, value in metrics.items():
              status = "PASS" if value >= 25.0 else "below 25%"
              line = f"- {name}: **{value:.2f}%** ({status})"
              print(line)
              lines.append(line)
          Path(summary_path).write_text(Path(summary_path).read_text() + "\n".join(lines) + "\n")
          PYTHON

      # رفع APK الموقّع
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Setat-Org-PRO-2027-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # رفع AAB الموقّع
      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Setat-Org-PRO-2027-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Upload R8's merged rules text; unlike the HTML analyzer, this avoids
      # the memory-heavy report generator while preserving the successful app build.
      - name: Upload R8 Merged Configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Setat-R8-Merged-Configuration
          path: app/build/outputs/mapping/release/r8-merged-configuration.txt
          if-no-files-found: warn
          retention-days: 7
