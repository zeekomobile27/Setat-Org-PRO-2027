plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {

    namespace 'com.zeekoltd.setat.pro'

    compileSdk 37

    // NDK r28 supports 16 KB page-size alignment by default.
    ndkVersion "28.2.13676358"

    defaultConfig {

        applicationId "com.zeekoltd.setat.pro"

        // Keep API 24 as requested.
        minSdk 24
        targetSdk 37
        versionCode 11
        versionName "2027.1"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"

                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        prefab true
    }
}

dependencies {

    // AndroidX - stable releases checked 2026-11-05
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater:1.1.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.browser:browser:1.10.0'

    // Image cropping
    implementation 'com.github.yalantis:ucrop:2.2.11'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'

    // Emoji and UI effects
    // BlurView 4.0.0: use the BlurTarget API and keep calls compatible with the current library API.
    implementation 'com.vanniktech:emoji-google:0.24.1'
    implementation 'com.github.Dimezis:BlurView:version-4.0.0'
    implementation 'nl.dionsegijn:konfetti-xml:2.2.0'

    // Google Ads and privacy consent
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // Firebase BoM manages compatible versions for Firebase modules.
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-config'

    // Modern Google sign-in via Android Credential Manager (official Firebase guidance).
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // FirebaseUI 10 is a major release; test all FirebaseUI flows after upgrade.
    implementation 'com.firebaseui:firebase-ui-database:10.0.0'

    // Keep all Media3 modules on the same version.
    def media3_version = "1.11.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-database:$media3_version"

    // Native audio
    implementation 'com.google.oboe:oboe:1.11.0'
}
