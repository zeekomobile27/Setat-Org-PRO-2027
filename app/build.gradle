plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {

    namespace 'com.zeekoltd.setat.pro'

    compileSdk 37

    // NDK r28 supports 16 KB page-size alignment by default.
    ndkVersion "28.2.13676358"

    defaultConfig {

        applicationId "com.zeekoltd.setat.pro"

        // Keep API 24 as requested.
        minSdk 24
        targetSdk 37
        versionCode 17
        versionName "2027.4"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"

                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            // Keep resources from every dynamically loaded mediation SDK.
            // R8 code shrinking/minification stays enabled below.
            shrinkResources false

            // The analyzer found an overbroad consumer rule in this exact
            // optional adapter: "-keep class androidx.** { *; }". Ignore
            // only that adapter's bundled rules; equivalent Mintegral SDK
            // rules are supplied by the Yandex adapter dependency below, and
            // the narrow AndroidX entry points are retained in proguard-rules.pro.
            optimization {
                keepRules {
                    ignoreFrom 'com.unity3d.ads-mediation:mintegral-adapter:5.19.0'
                }
            }

            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        prefab true
    }
}

dependencies {

    // AndroidX - stable releases checked 2026-11-05
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater:1.1.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.browser:browser:1.10.0'

    // Image cropping
    implementation 'com.github.yalantis:ucrop:2.2.11'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'

    // Emoji and UI effects

    implementation 'com.vanniktech:emoji-google:0.24.1'
    implementation 'nl.dionsegijn:konfetti-xml:2.2.0'

    // Yandex Mobile Ads core + the same supported partner adapters used by
    // the current 8.6.0.0 mediation bundle, declared individually.
    // The old unified bundle also pulled the deprecated IronSource/LevelPlay
    // adapter and its nested LevelPlay mediation stack.
    implementation 'com.yandex.android:mobileads:8.6.0'
    implementation 'com.yandex.ads.mediation:mobileads-applovin:13.6.3.3'
    implementation 'com.yandex.ads.mediation:mobileads-appnext:2.7.6.473.26'
    implementation 'com.yandex.ads.mediation:mobileads-bigoads:6.1.0.0'
    implementation 'com.yandex.ads.mediation:mobileads-chartboost:9.14.0.1'
    implementation 'com.yandex.ads.mediation:mobileads-digitalturbine:8.4.7.1'
    implementation 'com.yandex.ads.mediation:mobileads-google-nextgen:1.3.1.0'
    implementation 'com.yandex.ads.mediation:mobileads-inmobi:11.4.1.1'
    implementation 'com.yandex.ads.mediation:mobileads-moloco:4.12.0.0'
    implementation 'com.yandex.ads.mediation:mobileads-pangle:8.3.0.3.0'
    implementation 'com.yandex.ads.mediation:mobileads-startapp:5.3.1.3'
    implementation 'com.yandex.ads.mediation:mobileads-vungle:7.7.8.1'
    implementation 'com.yandex.ads.mediation:mobileads-mytarget:5.51.2.2'
    implementation 'com.yandex.ads.mediation:mobileads-mintegral:17.1.81.1'
    implementation 'com.yandex.ads.mediation:mobileads-unityads:4.20.0.1'
    implementation 'com.yandex.ads.mediation:mobileads-zmaticoo:1.8.5.17'
    implementation 'com.yandex.ads.mediation:mobileads-extras:8.6.0.0'

    // Yandex AppMetrica analytics.
    implementation 'io.appmetrica.analytics:analytics:8.6.0'

    // Official Google Play in-app update and review flows.
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:review:2.0.2'

    // Firebase BoM manages compatible versions for Firebase modules.
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-config'

    // Modern Google sign-in via Android Credential Manager (official Firebase guidance).
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // FirebaseUI 10 is a major release; test all FirebaseUI flows after upgrade.
    implementation 'com.firebaseui:firebase-ui-database:10.0.0'

    // Keep all Media3 modules on the same version.
    def media3_version = "1.11.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-database:$media3_version"

    // Legacy ExoPlayer 2 APIs required by Chartboost/Moloco mediation adapters.
    // This is separate from Media3 and does not replace the app's Media3 player.
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    // Native audio
    implementation 'com.google.oboe:oboe:1.11.0'

    // Required by billing:9.2.0 through core library desugaring.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
