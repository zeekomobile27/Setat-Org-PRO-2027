plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.zeekoltd.setat.pro'
    compileSdk 36 // تم تحديثه للتوافق مع أحدث مكتبات أندرويد

    defaultConfig {
        applicationId "com.zeekoltd.setat.pro"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"

        // دعم C++ مع حل مشكلة معمارية 16KB الإلزامية من جوجل
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // مسار ملف CMake الخاص بمحرك الصوت
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1" // لا يتغير لأنه يعتمد على إصدار NDK المثبت لديك
        }
    }

    // تفعيل Prefab لقراءة مكتبة Oboe
    buildFeatures {
        prefab true
    }
}

dependencies {
    // ==========================================
    // 1. مكتبات الأندرويد الأساسية (الأحدث لعام 2026)
    // ==========================================
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater:1.0.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.browser:browser:1.8.0' 
    
    // مكتبات الواجهة وتعديل الصور
    implementation 'com.github.yalantis:ucrop:2.2.8'
    implementation 'com.github.bumptech.glide:glide:5.0.9' // التحديث للإصدار الجذري الخامس
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'
    implementation 'com.vanniktech:emoji-google:0.20.0'
    implementation 'com.github.Dimezis:BlurView:version-2.0.6'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.2'

    // ==========================================
    // 2. إعلانات جوجل AdMob وموافقات المستخدمين (UMP) 🚀
    // ==========================================
    // أحدث إصدار مستقر من AdMob (سبتمبر 2026)
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    // أحدث إصدار من مكتبة UMP المتوافق مع AdMob 25+
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // ==========================================
    // 3. التحليلات وإشعارات فايربيس (جوجل فقط)
    // ==========================================
    // تم التحديث لأحدث منصة Firebase BOM 
    implementation platform('com.google.firebase:firebase-bom:34.19.0') 
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.firebaseui:firebase-ui-database:8.0.2'

    // ==========================================
    // 4. ExoPlayer (Media3) لتشغيل الفيديو والصوت
    // ==========================================
    def media3_version = "1.9.4"
    implementation "androidx.media3:media3-exoplayer:$media3_version" 
    implementation "androidx.media3:media3-datasource:$media3_version" 
    implementation "androidx.media3:media3-database:$media3_version" 

    // ==========================================
    // 5. مكتبة Oboe لدعم محرك C++ الصوتي
    // ==========================================
    implementation 'com.google.oboe:oboe:1.9.0'
}
